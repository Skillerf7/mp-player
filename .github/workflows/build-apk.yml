name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# Versions from project (app/build.gradle.kts):
# AGP 8.5.2, Kotlin 1.9.24, compileSdk 34, minSdk 26, Java 17
# Gradle 8.7 is compatible with AGP 8.5.2 (no wrapper jar in repo yet)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Unit-Tests
        run: gradle :app:testDebugUnitTest --stacktrace
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Debug-APK bauen
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SecretPlayer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
