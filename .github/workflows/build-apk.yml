name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Gradle 8.7 passt zu AGP 8.5.2 (kein Gradle-Wrapper im Repo noetig)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Debug-APK bauen
        run: gradle :app:assembleDebug --stacktrace

      # Unit-Tests (Equalizer-Mathe, ReplayGain). Ein fehlschlagender Test blockiert die APK nicht,
      # er wird aber im Lauf rot markiert und der Bericht unten hochgeladen.
      - name: Unit-Tests
        id: tests
        continue-on-error: true
        run: gradle :app:testDebugUnitTest --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: MusicPlayer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
